[project]
name = "ai-birthday-calendar"
version = "1.0.0"
description = "Self-hosted birthday tracker with AI-powered gift suggestions and email reminders"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    # bcrypt ignores everything past 72 bytes of a password. 4.x truncates
    # silently, so two different long passwords can share a hash; 5.x raises
    # instead. The API rejects over-long passwords before hashing, and this
    # floor keeps the library's own refusal as a backstop.
    "bcrypt>=5.0",
    "python-jose[cryptography]>=3.3.0",
    "apscheduler>=3.10.4",
    "openai>=1.10.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
# Pydantic's v1 compatibility shims (.dict(), .copy(), ...) are removed in
# Pydantic v3. Treating their deprecation warnings as errors means the suite
# fails the moment one is reintroduced, rather than the project quietly
# accumulating them again until an upgrade breaks.
filterwarnings = [
    "error::pydantic.PydanticDeprecatedSince20",
    # datetime.utcnow() returns a naive value that merely holds UTC.
    'error:datetime\.datetime\.utcnow\(\) is deprecated:DeprecationWarning',
    # FastAPI's startup/shutdown hooks, superseded by the lifespan handler.
    'error:on_event is deprecated:DeprecationWarning',
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routes"]

[tool.setuptools.package-data]
app = ["static/**/*"]
