# nginx reverse proxy for birthdays.corti.com -> Birthday Tracker on 127.0.0.1:8081
#
# Install (the 443 block and the HTTP->HTTPS redirect are added by certbot):
#   sudo cp ~/docker/birthdays/deploy/nginx-birthdays.corti.com.conf \
#           /etc/nginx/sites-available/birthdays.corti.com
#   sudo ln -s /etc/nginx/sites-available/birthdays.corti.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d birthdays.corti.com --redirect
#
# The DNS A record for birthdays.corti.com must already point at this host
# before running certbot, or the HTTP-01 challenge will fail.

# Throttle login attempts, per client IP. The app hashes with bcrypt, which is
# deliberately slow, but nothing else stood between the internet and unlimited
# guesses at /api/auth/token.
#
# This directive belongs to the http context, so it sits outside the server
# block -- sites-enabled/* is included from inside http{}. The zone name must
# be unique across every site on the host. 1 MB tracks roughly 16,000
# addresses; entries expire once an address goes quiet.
limit_req_zone $binary_remote_addr zone=birthdays_login:1m rate=5r/m;

# nginx answers a throttled request with 503 by default, which reads as "the
# server is broken" rather than "you are going too fast".
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    listen [::]:80;
    server_name birthdays.corti.com;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Login endpoint only. Everything else -- loading the page, reading
    # birthdays, saving an edit -- is unaffected by the limit.
    #
    # burst=5 nodelay allows five attempts back to back, so a person
    # mistyping a password is never blocked, and then permits one more every
    # twelve seconds. An exact-match location wins over the prefix "/" below.
    location = /api/auth/token {
        limit_req zone=birthdays_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_http_version 1.1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_http_version 1.1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/birthdays.corti.com_access.log;
    # "warn" is needed for limit_req_log_level above to be recorded at all:
    # error_log defaults to the "error" level, which discards warnings, so
    # throttled logins would otherwise leave no trace.
    error_log /var/log/nginx/birthdays.corti.com_error.log warn;
}
